name: ROM-Free Source Safety
on:
  push:
  pull_request:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository files contain no ROMs or binaries
        run: python3 tools/nxctl.py audit
      - name: Tests
        run: python3 -m unittest discover -s tests -v
